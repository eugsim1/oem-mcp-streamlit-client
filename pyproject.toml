[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oem-mcp-streamlit-client"
version = "1.1.0"
description = "A secure Streamlit client for the Oracle Enterprise Manager MCP server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eugene simos" }]
dependencies = [
  "streamlit>=1.55,<2",
  "requests>=2.31,<3",
  "psutil>=5.9,<8",
  "pandas>=2.1,<3",
  "jsonschema>=4.21,<5",
  "openai>=2.9,<4",
  "httpx>=0.28,<1",
  "oci-genai-auth>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["oem_mcp_client*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.coverage.run]
source = ["oem_mcp_client"]
omit = ["oem_mcp_client/ui_helpers.py"]
